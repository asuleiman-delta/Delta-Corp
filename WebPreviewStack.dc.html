<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
  <div onMouseEnter="{{ ecIn }}" onMouseLeave="{{ ecOut }}" style="position:relative;width:100%;aspect-ratio:1/1.12">
    <div style="position:absolute;left:0;right:0;bottom:0;height:{{ ecH1 }};border-radius:9px;overflow:hidden;background:#ffffff;filter:{{ ecF1 }};transition:height 1.5s cubic-bezier(.22,1,.36,1),filter 1.1s ease .4s">
      <img src="{{ img1 }}" alt="" loading="lazy" style="position:absolute;top:0;left:0;width:100%;height:auto;display:block">
    </div>
    <div style="position:absolute;inset:0;z-index:3;border-radius:9px;overflow:hidden">
      <img src="{{ img2 }}" alt="" loading="lazy" style="position:absolute;left:9%;width:82%;bottom:0;z-index:2;height:auto;display:block;border-radius:4px 4px 0 0;background:#ffffff;box-shadow:0 18px 36px -14px rgba(10,2,35,.6);opacity:{{ ecO2 }};transform:{{ ecT2 }};filter:{{ ecF2 }};transition:opacity 1s ease .45s,transform 1.35s cubic-bezier(.22,1,.36,1) .45s,filter 1.1s ease .95s">
      <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:22%;z-index:6;pointer-events:none;background:linear-gradient(to top,rgba(10,2,35,.34),rgba(10,2,35,0))"></div>
      <img src="{{ img3 }}" alt="" loading="lazy" style="position:absolute;left:13%;width:74%;bottom:0;z-index:4;height:auto;display:block;border-radius:4px 4px 0 0;background:#ffffff;box-shadow:0 18px 36px -14px rgba(10,2,35,.6);opacity:{{ ecO3 }};transform:{{ ecT3 }};transition:{{ ecTr3 }}">
    </div>
    <div aria-hidden="true" style="position:absolute;left:50%;top:50%;width:34%;max-width:96px;aspect-ratio:1/1;border-radius:50%;z-index:8;pointer-events:none;backdrop-filter:blur(7px) saturate(130%);-webkit-backdrop-filter:blur(7px) saturate(130%);display:{{ plusShow }};opacity:{{ plusO }};transform:{{ plusT }};transition:opacity .8s ease .25s,transform 1s cubic-bezier(.22,1,.36,1) .25s">
      <img src="assets/web/plus.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;display:block">
    </div>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:340},&quot;img1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/web/ec-1.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/web/ec-2.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/web/ec-3.png&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ec: false };
  renderVals() {
    const ec = this.state.ec;
    const solo = !!this.props.solo;
    return {
      ecIn: () => this.setState({ ec: true }),
      ecOut: () => this.setState({ ec: false }),
      ecH1: ec ? '120%' : '100%',
      ecO2: (solo || this.props.noStep2) ? 0 : (ec ? 1 : 0),
      ecT2: ec ? 'translateY(0)' : 'translateY(26%)',
      ecO3: solo ? 0 : (ec ? 1 : 0),
      ecT3: ec ? 'translateY(0)' : 'translateY(34%)',
      ecF1: ec ? (this.props.plus ? 'blur(3px) brightness(.7)' : (solo ? 'none' : 'blur(0.8px) brightness(.9)')) : 'none',
      ecF2: ec ? 'blur(0.5px) brightness(.94)' : 'none',
      ecTr3: this.props.noStep2
        ? 'opacity 1s ease .35s,transform 1.5s cubic-bezier(.22,1,.36,1) .35s'
        : 'opacity 1s ease .95s,transform 1.35s cubic-bezier(.22,1,.36,1) .95s',
      plusShow: this.props.plus ? 'block' : 'none',
      plusO: ec ? 1 : 0,
      plusT: ec ? 'translate(-50%,-50%) scale(1)' : 'translate(-50%,-42%) scale(.72)',
      img1: this.props.img1 ?? 'assets/web/ec-1.png',
      img2: this.props.img2 ?? 'assets/web/ec-2.png',
      img3: this.props.img3 ?? 'assets/web/ec-3.png'
    };
  }
}

</script>
</body>
</html>
